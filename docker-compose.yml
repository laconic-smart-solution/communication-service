services:
  postgres:
    image: postgres:16-alpine
    container_name: comms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comms}
      POSTGRES_DB: ${POSTGRES_DB:-communication}
    ports:
      - "5433:5432"
    volumes:
      - comms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comms} -d ${POSTGRES_DB:-communication}"]
      interval: 5s
      timeout: 5s
      retries: 10

  facebook-service:
    build:
      context: .
      dockerfile: app/facebook-service/Dockerfile
    container_name: comms-facebook-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FACEBOOK_SERVICE_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-comms}:${POSTGRES_PASSWORD:-comms}@postgres:5432/${POSTGRES_DB:-communication}?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      GATEWAY_SECRET: ${GATEWAY_SECRET:-hello}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  line-service:
    build:
      context: .
      dockerfile: app/line-service/Dockerfile
    container_name: comms-line-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LINE_SERVICE_PORT: "8083"
      DATABASE_URL: postgres://${POSTGRES_USER:-comms}:${POSTGRES_PASSWORD:-comms}@postgres:5432/${POSTGRES_DB:-communication}?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      GATEWAY_SECRET: ${GATEWAY_SECRET:-hello}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  normalization-service:
    build:
      context: .
      dockerfile: app/normalization-service/Dockerfile
    container_name: comms-normalization-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NORMALIZATION_SERVICE_PORT: "8090"
      LINE_SERVICE_URL: http://line-service:8083
      FACEBOOK_SERVICE_URL: http://facebook-service:8081
      GATEWAY_SECRET: ${GATEWAY_SECRET:-hello}
      PLAYGROUND_ENABLED: ${PLAYGROUND_ENABLED:-true}
    ports:
      - "8090:8090"
    depends_on:
      line-service:
        condition: service_started
      facebook-service:
        condition: service_started

  gateway:
    build:
      context: app/gateway
      dockerfile: Dockerfile
    container_name: comms-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_SECRET: ${GATEWAY_SECRET:-hello}
      GATEWAY_JWT_HMAC_SECRET: ${GATEWAY_JWT_HMAC_SECRET:-comms-local-dev-jwt-hmac-secret-ok!}
      NORMALIZATION_SERVICE_URI: http://normalization-service:8090
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      normalization-service:
        condition: service_started

volumes:
  comms_pgdata:

server:
  port: ${GATEWAY_PORT:8099}

spring:
  application:
    name: communication-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      forwarded:
        enabled: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      routes:
        - id: comms-facebook
          uri: ${FACEBOOK_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/comms/facebook/**
          filters:
            - RewritePath=/comms/facebook/(?<segment>.*), /${segment}

        - id: comms-line
          uri: ${LINE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/comms/line/**
          filters:
            - RewritePath=/comms/line/(?<segment>.*), /${segment}

        - id: comms-lazada
          uri: ${LAZADA_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/comms/lazada/**
          filters:
            - RewritePath=/comms/lazada/(?<segment>.*), /${segment}

        - id: comms-shopee
          uri: ${SHOPEE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/comms/shopee/**
          filters:
            - RewritePath=/comms/shopee/(?<segment>.*), /${segment}

        - id: comms-tiktok
          uri: ${TIKTOK_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/comms/tiktok/**
          filters:
            - RewritePath=/comms/tiktok/(?<segment>.*), /${segment}

        - id: comms-telegram
          uri: ${TELEGRAM_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/comms/telegram/**
          filters:
            - RewritePath=/comms/telegram/(?<segment>.*), /${segment}

        - id: comms-viber
          uri: ${VIBER_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/comms/viber/**
          filters:
            - RewritePath=/comms/viber/(?<segment>.*), /${segment}

        - id: comms-whatsapp
          uri: ${WHATSAPP_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/comms/whatsapp/**
          filters:
            - RewritePath=/comms/whatsapp/(?<segment>.*), /${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  sharedSecret: ${GATEWAY_SECRET:hello}
  auth:
    userIdClaim: ${GATEWAY_USER_ID_CLAIM:sub}
    tenantIdClaim: ${GATEWAY_TENANT_ID_CLAIM:tenant_id}
  cors:
    allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    hmacSecret: ${GATEWAY_JWT_HMAC_SECRET:comms-local-dev-jwt-hmac-secret-ok!}
